<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101914">
    <title>Visualizador 3D</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101914;
        color: #f2f5f1;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 50% 42%, #263a2b 0, #17231b 42%, #101914 78%);
      }

      main {
        display: flex;
        width: min(1200px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px clamp(16px, 4vw, 48px) 22px;
        flex-direction: column;
      }

      header { padding: 4px 2px 18px; }

      .eyebrow {
        margin: 0 0 7px;
        color: #a8c4a6;
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 2.15rem);
        font-weight: 650;
        letter-spacing: -0.035em;
      }

      .hint {
        margin: 8px 0 0;
        color: #bdc9be;
        font-size: 0.95rem;
      }

      .viewer {
        position: relative;
        flex: 1;
        min-height: min(68vh, 680px);
        overflow: hidden;
        border: 1px solid #ffffff1a;
        border-radius: 18px;
        background: #18251c;
        box-shadow: 0 22px 70px #0005;
      }

      model-viewer {
        display: block;
        width: 100%;
        height: 100%;
        min-height: min(68vh, 680px);
        --poster-color: transparent;
        --progress-bar-color: #b3d29b;
        --progress-bar-height: 3px;
      }

      model-viewer.loaded::part(default-progress-bar) { display: none; }

      #status {
        position: absolute;
        right: 14px;
        bottom: 12px;
        left: 14px;
        width: fit-content;
        margin: 0 auto;
        padding: 8px 12px;
        border: 1px solid #ffffff1a;
        border-radius: 999px;
        background: #101914d9;
        color: #e2e9e1;
        font-size: 0.82rem;
        pointer-events: none;
      }

      #status[hidden] { display: none; }
      #status.error { color: #ffc0b8; }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 2px 0;
        color: #aebbb0;
        font-size: 0.8rem;
      }

      @media (max-width: 560px) {
        main { padding-top: 20px; }
        .viewer, model-viewer { min-height: 68vh; }
        footer { flex-direction: column; gap: 5px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Visualizador 3D</p>
        <h1 id="page-title">Modelo em 3D</h1>
        <p class="hint">Arraste para orbitar · role para aproximar · botão direito para deslocar</p>
      </header>

      <section class="viewer" aria-label="Visualizador de modelo 3D">
        <model-viewer
          id="terrain"
          camera-controls
          camera-orbit="0deg 65deg 4300m"
          min-camera-orbit="auto auto 2000m"
          touch-action="pan-y"
          shadow-intensity="0"
          exposure="1"
          tone-mapping="neutral"
          interaction-prompt="auto"
          loading="eager">
        </model-viewer>
        <p id="status" role="status">Carregando terreno e mosaico…</p>
      </section>

      <footer>
        <span id="model-description">Modelo 3D interativo</span>
        <span>Controles: mouse, toque ou trackpad</span>
      </footer>
    </main>
    <script>
      const viewer = document.querySelector("#terrain");
      const status = document.querySelector("#status");
      const params = new URLSearchParams(window.location.search);
      const modelUrl = params.get("model") || "./terreno_mari1.glb";
      const pageTitle = params.get("title") || "Modelo em 3D";
      let loadingTimer = null;

      const finishLoading = () => {
        status.hidden = true;
        viewer.classList.add("loaded");
        if (loadingTimer !== null) window.clearInterval(loadingTimer);
      };

      document.title = `${pageTitle} | Visualizador 3D`;
      document.querySelector("#page-title").textContent = pageTitle;
      viewer.setAttribute("alt", `${pageTitle}, modelo tridimensional interativo`);

      try {
        const parsedModelUrl = new URL(modelUrl, window.location.href);
        if (!["http:", "https:"].includes(parsedModelUrl.protocol)) {
          throw new Error("O modelo precisa usar um endereço HTTP ou HTTPS.");
        }
        viewer.src = parsedModelUrl.href;
        if (modelUrl !== "./terreno_mari1.glb") {
          document.querySelector("#model-description").textContent =
            "Modelo 3D carregado por endereço URL";
        }
      } catch (error) {
        status.classList.add("error");
        status.textContent =
          error instanceof Error ? error.message : "Endereço do modelo inválido.";
      }

      loadingTimer = window.setInterval(() => {
        if (viewer.loaded) {
          finishLoading();
        }
      }, 500);

      viewer.addEventListener("load", finishLoading);
      viewer.addEventListener("error", () => {
        status.hidden = false;
        status.classList.add("error");
        status.textContent =
          "Não foi possível carregar o modelo. Confira o endereço e as permissões CORS.";
        window.clearInterval(loadingTimer);
      });
      if (viewer.loaded) finishLoading();
    </script>
  </body>
</html>
